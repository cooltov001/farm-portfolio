<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AL-HIKMAH Student Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://pixabay.com/images/download/ri_lens-fireworks-10444646_1920.jpg') no-repeat center center/cover;
    }

    .login-container {
      display: flex;
      width: 780px;
      max-width: 95%;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
    }

    .left-panel {
      width: 280px;
      background: #ffffff;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-section img {
      width: 70px;
      height: auto;
      margin-bottom: 8px;
    }

    .uni-name {
      font-size: 18px;
      font-weight: bold;
      color: #1a5c2e;
      line-height: 1.2;
    }

    .uni-location {
      font-size: 12px;
      color: #555;
      margin-top: 2px;
    }

    .uni-tagline {
      font-size: 11px;
      color: #777;
      font-style: italic;
      margin-top: 4px;
    }

    .nav-buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-btn {
      background: #1e90ff;
      color: white;
      border: none;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: #1873cc;
    }

    .right-panel {
      flex: 1;
      background: rgba(20, 30, 50, 0.92);
      padding: 35px 40px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .portal-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 30px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    .form-group input[type="text"],
    .form-group input[type="password"] {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }

    .form-group .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #555;
      font-size: 16px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0 25px;
      font-size: 13px;
    }

    .button-row {
      display: flex;
      gap: 12px;
    }

    .login-btn {
      flex: 1;
      background: #1e90ff;
      color: white;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #1873cc;
    }

    .reset-btn {
      flex: 1;
      background: #e67e22;
      color: white;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .reset-btn:hover {
      background: #d35400;
    }

    .forgot-password {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
    }

    .forgot-password a {
      color: #7ec8ff;
      text-decoration: none;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    /* ===== FOOTER ===== */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #1a5c2e;
      color: white;
      text-align: center;
      padding: 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- LEFT SIDE -->
    <div class="left-panel">
      <div class="logo-section">
        <!-- Replace with actual logo -->
        <img src="logo.png" alt="Al-Hikmah Logo">
        <div class="uni-name">AL-HIKMAH University</div>
        <div class="uni-location">Ilorin - Nigeria</div>
        <div class="uni-tagline">Learning for wisdom and morality</div>
      </div>

      <div class="nav-buttons">
        <button class="nav-btn">Official Website</button>
        <button class="nav-btn">Portal Home</button>
        <button class="nav-btn">Registration Instructions</button>
        <button class="nav-btn">Help Desk</button>
      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right-panel">
      <div class="portal-title">.: AL-HIKMAH Student Portal</div>

      <form>
        <div class="form-group">
          <span class="icon">👤</span>
          <input type="text" placeholder="Username">
        </div>

        <div class="form-group">
          <span class="icon">🔒</span>
          <input type="password" placeholder="Password">
        </div>

        <div class="remember-me">
          <input type="checkbox" id="remember">
          <label for="remember">Remember Me</label>
        </div>

        <div class="button-row">
          <button type="submit" class="login-btn">CLICK HERE TO LOGIN</button>
          <button type="reset" class="reset-btn">RESET</button>
        </div>
      </form>

      <div class="forgot-password">
        Forgot Password? <a href="#">Click here...</a>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    Al-Hikmah University, Ilorin ICT Directorate || Powered by Brainbench Technology Nig. Ltd. © 2026, All Rights Reserved
  </div>

</body>
</html>
