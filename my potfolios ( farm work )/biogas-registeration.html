<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biogas Registration Form | Nexus Smart Farms</title>
  <link rel="icon" href="https://cdn.dribbble.com/userupload/28399362/file/original-dc16780f00613e8b1383bc2b8ec933cb.png">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      background: white;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    /* Header */
    .form-header {
      background: #1a4d2e;
      color: white;
      text-align: center;
      padding: 32px 25px;
    }

    .form-header h1 {
      font-size: 1.9rem;
      margin-bottom: 8px;
    }

    .form-header p {
      opacity: 0.9;
      font-size: 1rem;
    }

    .back-link {
      display: inline-block;
      margin-top: 15px;
      color: #a8e063;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* Form */
    form {
      padding: 40px 35px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
      color: #1a4d2e;
      font-size: 0.95rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      background: #f9fafb;
      transition: all 0.3s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #1a4d2e;
      background: white;
      box-shadow: 0 0 0 4px rgba(26, 77, 46, 0.12);
    }

    /* Gender */
    .gender-group {
      display: flex;
      gap: 25px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .gender-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #444;
      cursor: pointer;
    }

    /* Categories */
    fieldset {
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    legend {
      padding: 0 12px;
      font-weight: 600;
      color: #1a4d2e;
      font-size: 1rem;
    }

    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 12px;
    }

    .categories label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      color: #444;
      cursor: pointer;
    }

    /* Buttons */
    .buttons {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button[type="submit"] {
      background: #1a4d2e;
      color: white;
    }

    button[type="submit"]:hover {
      background: #143d24;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(26, 77, 46, 0.3);
    }

    button[type="reset"] {
      background: #e5e7eb;
      color: #374151;
    }

    button[type="reset"]:hover {
      background: #d1d5db;
    }

    /* Footer */
    .form-footer {
      text-align: center;
      padding: 18px;
      background: #f1f8e9;
      color: #555;
      font-size: 0.9rem;
    }

    .form-footer a {
      color: #1a4d2e;
      font-weight: 600;
      text-decoration: none;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 600px) {
      form {
        padding: 30px 22px;
      }

      .form-header h1 {
        font-size: 1.6rem;
      }

      .categories {
        grid-template-columns: 1fr;
      }

      .gender-group {
        flex-direction: column;
        gap: 12px;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Header -->
    <div class="form-header">
      <h1>Biogas Registration Form</h1>
      <p>Register for Biogas Setup or Training</p>
      <a href="biogas.html" class="back-link">← Back to Biogas Hub</a>
    </div>

    <form>
      <!-- Full Name -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" maxlength="40" placeholder="Enter your full name" required>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="yourname@email.com" required>
      </div>

      <!-- Username -->
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" maxlength="20" placeholder="Choose a username" required>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a strong password" required>
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="e.g. 0801 234 5678" required>
      </div>

      <!-- Date of Birth -->
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" required>
      </div>

      <!-- Gender -->
      <div class="form-group">
        <label>Gender</label>
        <div class="gender-group">
          <label>
            <input type="radio" name="gender" value="Male"> Male
          </label>
          <label>
            <input type="radio" name="gender" value="Female"> Female
          </label>
          <label>
            <input type="radio" name="gender" value="Others"> Others
          </label>
        </div>
      </div>

      <!-- State -->
      <div class="form-group">
        <label for="state">State</label>
        <select id="state" name="state" required>
          <option value="">-- Select your state --</option>
          <option value="OS">Osun</option>
          <option value="OG">Ogun</option>
          <option value="LA">Lagos</option>
          <option value="OD">Ondo</option>
          <option value="EK">Ekiti</option>
          <option value="AK">Akwa-Ibom</option>
          <option value="OY">Oyo</option>
          <option value="KW">Kwara</option>
          <option value="ED">Edo</option>
          <option value="AB">Abia</option>
          <option value="IM">Imo</option>
          <option value="KD">Kaduna</option>
          <option value="KN">Kano</option>
          <option value="KT">Katsina</option>
          <option value="EN">Enugu</option>
          <option value="AD">Adamawa</option>
          <option value="RV">Rivers</option>
          <option value="SO">Sokoto</option>
          <option value="TA">Taraba</option>
          <option value="BA">Bauchi</option>
          <option value="BO">Borno</option>
          <option value="DE">Delta</option>
          <option value="KO">Kogi</option>
          <option value="NI">Niger</option>
          <option value="CR">Cross River</option>
          <option value="PL">Plateau</option>
          <option value="GO">Gombe</option>
          <option value="FCT">FCT</option>
        </select>
      </div>

      <!-- Categories -->
      <fieldset>
        <legend>What are you interested in?</legend>
        <div class="categories">
          <label>
            <input type="checkbox" name="interest" value="biogas-setup"> Biogas Setup
          </label>
          <label>
            <input type="checkbox" name="interest" value="biogas-training"> Biogas Training
          </label>
        </div>
      </fieldset>

      <!-- Address -->
      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="4" placeholder="Enter your full address"></textarea>
      </div>

      <!-- Buttons -->
      <div class="buttons">
        <button type="submit">Submit Registration</button>
        <button type="reset">Reset Form</button>
      </div>
    </form>

    <div class="form-footer">
      <a href="biogas.html">← Return to Biogas Hub</a>
    </div>

  </div>

</body>
</html>
