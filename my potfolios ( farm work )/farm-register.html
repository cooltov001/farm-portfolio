<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Registration Form</title>
  <link rel="icon" href="https://cdn.dribbble.com/userupload/28399362/file/original-dc16780f00613e8b1383bc2b8ec933cb.png">
  
  <!-- Modern font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1a4d2e;
      --primary-dark: #0f3320;
      --accent: #a8e063;
      --accent-dark: #8bc34a;
      --bg: #f4f7f2;
      --white: #ffffff;
      --text: #1f2937;
      --text-light: #6b7280;
      --radius: 16px;
      --shadow: 0 15px 40px rgba(0,0,0,0.1);
      --shadow-hover: 0 20px 50px rgba(0,0,0,0.14);
      --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 50%, #f4f7f2 100%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 50px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 720px;
      width: 100%;
      background: var(--white);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: var(--transition);
      animation: fadeUp 0.7s ease forwards;
    }

    .container:hover {
      box-shadow: var(--shadow-hover);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========== HEADER ========== */
    .form-header {
      background: linear-gradient(135deg, #1a4d2e 0%, #2e7d32 100%);
      color: white;
      text-align: center;
      padding: 40px 30px 35px;
      position: relative;
      overflow: hidden;
    }

    .form-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(168,224,99,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .form-header h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
      position: relative;
    }

    .form-header p {
      opacity: 0.92;
      font-size: 1.05rem;
      position: relative;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 18px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: var(--transition);
      padding: 6px 14px;
      border-radius: 50px;
      position: relative;
    }

    .back-link:hover {
      background: rgba(168, 224, 99, 0.15);
      transform: translateX(-4px);
    }

    /* ========== FORM BODY ========== */
    form {
      padding: 42px 40px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--primary);
      font-size: 0.95rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
      background: #fafafa;
      transition: var(--transition);
      color: var(--text);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(26, 77, 46, 0.12);
    }

    textarea {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #e5e7eb;
  border-radius: 12px;
  font-size: 1rem;
  font-family: inherit;
  background: #fafafa;
  transition: var(--transition);
  color: var(--text);
  height: 120px;          
  max-height: 200px;     
  resize: none;           
  overflow-y: auto;      
}
    

    /* Gender */
    .gender-group {
      display: flex;
      gap: 28px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .gender-group label {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 500;
      color: #4b5563;
      cursor: pointer;
      transition: var(--transition);
    }

    .gender-group label:hover {
      color: var(--primary);
    }

    .gender-group input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* Categories */
    fieldset {
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 28px;
      transition: var(--transition);
    }

    fieldset:hover {
      border-color: #d1d5db;
    }

    legend {
      padding: 0 14px;
      font-weight: 700;
      color: var(--primary);
      font-size: 1rem;
    }

    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    .categories label {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 500;
      color: #4b5563;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 10px;
      transition: var(--transition);
    }

    .categories label:hover {
      background: #f0f7eb;
      color: var(--primary);
    }

    .categories input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* Buttons */
    .buttons {
      display: flex;
      gap: 16px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
    }

    button[type="submit"] {
      background: var(--primary);
      color: white;
      box-shadow: 0 6px 20px rgba(26, 77, 46, 0.25);
    }

    button[type="submit"]:hover {
      background: var(--primary-dark);
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(26, 77, 46, 0.35);
    }

    button[type="reset"] {
      background: #f3f4f6;
      color: #4b5563;
    }

    button[type="reset"]:hover {
      background: #e5e7eb;
      transform: translateY(-2px);
    }

    /* Footer note */
    .form-footer {
      text-align: center;
      padding: 20px;
      background: #f0f7eb;
      color: var(--text-light);
      font-size: 0.95rem;
    }

    .form-footer a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition);
    }

    .form-footer a:hover {
      color: var(--accent-dark);
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 600px) {
      body {
        padding: 30px 16px;
      }

      form {
        padding: 32px 24px;
      }

      .form-header {
        padding: 32px 24px 28px;
      }

      .form-header h1 {
        font-size: 1.7rem;
      }

      .categories {
        grid-template-columns: 1fr;
      }

      .gender-group {
        flex-direction: column;
        gap: 12px;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Header -->
    <div class="form-header">
      <h1>Farmer Registration</h1>
      <p>Join Nexus Smart Farms today</p>
      <a href="potfolio.html" class="back-link">← Back to Homepage</a>
    </div>

    <form>
      <!-- Full Name -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" maxlength="40" placeholder="Enter your full name" required>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="yourname@email.com" required>
      </div>

      <!-- Username -->
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" maxlength="20" placeholder="Choose a username" required>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a strong password" required>
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="e.g. 0801 234 5678" required>
      </div>

      <!-- Date of Birth -->
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" required>
      </div>

      <!-- Gender -->
      <div class="form-group">
        <label>Gender</label>
        <div class="gender-group">
          <label>
            <input type="radio" name="gender" value="Male"> Male
          </label>
          <label>
            <input type="radio" name="gender" value="Female"> Female
          </label>
          <label>
            <input type="radio" name="gender" value="Others"> Others
          </label>
        </div>
      </div>

      <!-- State -->
      <div class="form-group">
        <label for="state">State</label>
        <select id="state" name="state" required>
          <option value="">-- Select your state --</option>
          <option value="OS">Osun</option>
          <option value="OG">Ogun</option>
          <option value="LA">Lagos</option>
          <option value="OD">Ondo</option>
          <option value="EK">Ekiti</option>
          <option value="AK">Akwa-Ibom</option>
          <option value="OY">Oyo</option>
          <option value="KW">Kwara</option>
          <option value="ED">Edo</option>
          <option value="AB">Abia</option>
          <option value="IM">Imo</option>
          <option value="KD">Kaduna</option>
          <option value="KN">Kano</option>
          <option value="KT">Katsina</option>
          <option value="EN">Enugu</option>
          <option value="AD">Adamawa</option>
          <option value="RV">Rivers</option>
          <option value="SO">Sokoto</option>
          <option value="TA">Taraba</option>
          <option value="BA">Bauchi</option>
          <option value="BO">Borno</option>
          <option value="DE">Delta</option>
          <option value="KO">Kogi</option>
          <option value="NI">Niger</option>
          <option value="CR">Cross River</option>
          <option value="PL">Plateau</option>
          <option value="GO">Gombe</option>
          <option value="FCT">FCT</option>
        </select>
      </div>

      <!-- Categories -->
      <fieldset>
        <legend>Select Categories of Interest</legend>
        <div class="categories">
          <label>
            <input type="checkbox" name="categories" value="biogas"> Biogas Setup
          </label>
          <label>
            <input type="checkbox" name="categories" value="crops"> Crops
          </label>
          <label>
            <input type="checkbox" name="categories" value="livestock"> Livestock
          </label>
          <label>
            <input type="checkbox" name="categories" value="investing"> Investing
          </label>
        </div>
      </fieldset>

      <!-- Address -->
      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="4" placeholder="Enter your full address"></textarea>
      </div>

      <!-- Buttons -->
      <div class="buttons">
        <button type="submit">Create Account</button>
        <button type="reset">Reset Form</button>
      </div>
    </form>

    <div class="form-footer">
      Already have an account? <a href="potfolio.html">Go back to the homepage</a> and login.
    </div>

  </div>

</body>
</html>
