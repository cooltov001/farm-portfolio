<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Pricing Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 60px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .pricing-card {
      width: 340px;
      background: #ffffff;               
      border: 1px solid #ddd;            
      padding: 35px 30px;              
      text-align: center;
    }

    .plan-title {
      font-size: 1.4rem;
      color: #333;
      margin-bottom: 10px;
    }

    .price {
      font-size: 2.8rem;                 
      font-weight: 700;
      color: #1a1a2e;
    }

    .price span {
      font-size: 1rem;
      font-weight: 400;
      color: #777;
    }

    .features {
      list-style: none;                  
      padding: 0;
      margin: 0 0 30px 0;
      text-align: left;
    }

    .features li {
      padding: 10px 0;
      color: #555;
      font-size: 0.95rem;
      border-bottom: 1px solid #f0f0f0;
    }

    .features li:last-child {
      border-bottom: none;
    }

    .signup-btn {
      display: block;
      width: 100%;                       
      padding: 14px;
      background: #1a1a2e;
      color: white;
      text-decoration: none;             
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.3s, transform 0.2s;
    }

    .signup-btn:hover {
      background: #16213e;              
      transform: translateY(-2px);
    }

    .signup-btn:focus {
      outline: 3px solid #4dabf7;      
      outline-offset: 2px;
    }

    .signup-btn:active {
      background: #0f3460;
    }
  </style>
</head>
<body>

  <div class="pricing-card">
    <h2 class="plan-title">Pro Plan</h2>
    <div class="price">$29 <span>/ month</span></div>

    <ul class="features">
      <li>Unlimited Projects</li>
      <li>Advanced Analytics</li>
      <li>Priority Support</li>
      <li>Custom Domains</li>
      <li>Team Collaboration</li>
    </ul>

    <a href="#" class="signup-btn">Sign Up Now</a>
  </div>

</body>
</html>
