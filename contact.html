    <hr>

    <h1 style="color: rgb(13, 107, 1);" > OIC FOOTBALL CLUB</h1>

    <p>Have a favourite player or memorable match? Share your thoughts with us!</p>

    <form>
        <label for="name">Your Name:</label><br>
        <input type="text" id="name" name="name" required placeholder="Full Name">
        <br><br>

        <label for="email">Your Email:</label><br>
        <input type="email" id="email" name="email" required placeholder="email address">
        <br><br>

        <label for="message">Your Message / Feedback:</label><br>
        <textarea id="message" name="message" rows="5" cols="50" required></textarea>
        <br><br>

        <button type="submit">Send Message</button>
        <button type="reset">Clear</button>
    </form>

</body>
