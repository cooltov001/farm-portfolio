<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Razor - Agent Login</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="csswork.css" />
  </head>
  <body>
    <div class="top-bar">
      <a href="#" class="logo">Razor</a>
      <div class="top-right">
        <a href="#"><i class="fas fa-globe"></i></a>
        <a href="facebook2.html">Sign up</a>
        <button class="btn-demo">Request Demo</button>
      </div>
    </div>

    <div class="main">
      <div class="decor-left">
        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
        <div class="square"></div>
        <div class="dots"></div>
        <div class="arrow-box">↗</div>
      </div>

      <div class="login-card">
        <h1>Agent Login</h1>
        <p class="subtitle">
          Hey, Enter your details to get sign in<br />to your account
        </p>

        <form>
          <div class="form-group">
            <input type="text" placeholder="Enter Email / Phone No" required />
          </div>

          <div class="form-group passcode-wrapper">
            <input type="password" placeholder="Passcode" required />
            <span class="hide">Hide</span>
          </div>

          <div class="trouble">
            <a href="#">Having trouble in sign in?</a>
          </div>

          <button type="submit" class="btn-signin">Sign in</button>
        </form>

        <div class="divider">Or Sign in with</div>

        <div class="social-login">
          <button class="social-btn">
            <i class="fab fa-google"></i> Google
          </button>
          <button class="social-btn">
            <i class="fab fa-apple"></i> Apple ID
          </button>
          <button class="social-btn">
            <i class="fab fa-facebook-f"></i> Facebook
          </button>
        </div>

        <p class="request">
          Don't have an account? <a href="#">Request Now</a>
        </p>
      </div>

      <div class="decor-right">
        <div class="wave"></div>
        <div class="chat"></div>
        <div class="dots"></div>

        <div class="person">
          <div class="hair"></div>
          <div class="head"></div>
          <div class="body"></div>
          <div class="laptop"></div>
        </div>
      </div>
    </div>

    <div class="footer">Copyright 2022 <a href="#">Privacy Policy</a></div>
  </body>
</html>
