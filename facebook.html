<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook - log in or sign up</title>
  <link rel="stylesheet" href="facebook.css ">
</head>
<body>
  <div class="page">
    <div class="hero">
      <div class="fb-logo">f</div>

      <div class="emoji"></div>

      <div class="card card-plant">
        <div class="badge">m</div>
        <img src="https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=400&h=400&fit=crop" alt="Plant">
      </div>

      <div class="card card-main">
        <div class="time"> 16:45</div>
        <img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=600&h=700&fit=crop" alt="Woman">
      </div>

      <div class="card card-skate">
        <img src="https://images.unsplash.com/photo-1547036967-23d11aacaee0?w=400&h=300&fit=crop" alt="Skate park">
        <div class="progress"></div>
      </div>

      <div class="card card-avatar">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop" alt="Person">
      </div>

      <div class="like"></div>

      <h1 class="hero-title">
        Explore<br>
        the<br>
        things<br>
        <span class="blue">you love.</span>
      </h1>
    </div>

    <div class="login-panel">
      <div class="login-box">
        <h2>Log in to Facebook</h2>

        <form onsubmit="return false;">
          <div class="form-group">
            <input type="text" placeholder="Email address or mobile number" autofocus>
          </div>
          <div class="form-group">
            <input type="password" placeholder="Password">
          </div>

          <button type="submit" class="btn-login">Log in</button>
        </form>

        <a href="#" class="forgot">Forgotten password?</a>

        <div class="divider"></div>

        <a href="facebook2.html" class="btn-create">Create new account</a>
      </div>

      <div class="meta-logo">
        <span>∞ Meta</span>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div class="languages">
        <a href="#" class="active">English (UK)</a>
        <a href="#">Hausa</a>
        <a href="#">Français (France)</a>
        <a href="#">Português (Brasil)</a>
        <a href="#">Español</a>
        <a href="#">العربية</a>
        <a href="#">Bahasa Indonesia</a>
        <a href="#">More languages...</a>
      </div>
    </div>
  </footer>
</body>
</html>
