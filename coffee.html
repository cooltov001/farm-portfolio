<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
      background: #f8e9e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      background: #4a1c1c;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
      position: relative;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 50px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-size: 26px;
      font-weight: 700;
      text-decoration: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: #e67e22;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    nav {
      display: flex;
      gap: 36px;
    }

    nav a {
      color: #f0d9c8;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      transition: color 0.25s;
    }

    nav a:hover {
      color: #e67e22;
    }

    .hero {
      display: flex;
      align-items: center;
      padding: 40px 50px 70px;
      gap: 40px;
    }

    .hero-content {
      flex: 1;
      color: white;
    }

    .subtitle {
      font-family: 'Georgia', serif;
      font-style: italic;
      color: #e67e22;
      font-size: 28px;
      margin-bottom: 12px;
    }

    .hero-content h1 {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 22px;
    }

    .hero-content p {
      font-size: 17px;
      color: #e8c9b5;
      line-height: 1.6;
      max-width: 420px;
      margin-bottom: 36px;
    }

    .buttons {
      display: flex;
      gap: 16px;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: #e67e22;
      color: white;
      border: 2px solid #e67e22;
    }

    .btn-primary:hover {
      background: #d35400;
      border-color: #d35400;
    }

    .btn-outline {
      background: transparent;
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.6);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: white;
    }

    .hero-image {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-image img {
      max-width: 300%;
      height: auto;
      max-height: 680px;
      object-fit: contain;
    }

   
    

    
    
  </style>
  
</head>
<body>

  <div class="container">
    <header >
      <a href="#" class="logo">
        <div class="logo-icon"></div>
               Coffee
      </a>

      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Menu</a>
        <a href="#">Testimonials</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <div class="subtitle">Best Coffee</div>
        <h1>Make your day great with our<br>special coffee!</h1>
        <p>Welcome to our coffee paradise where every bean tells a story and every cup sparks joy.</p>

        <div class="buttons">
          <a href="#" class="btn btn-primary">Order Now</a>
          <a href="#" class="btn btn-outline">Contact Us</a>
        </div>
      </div>

      <div class="hero-image">
        <img src="download.png" 
             alt="Coffee cup with splash and beans">
      </div>
    </section>
  </div>

</body>
</html>
